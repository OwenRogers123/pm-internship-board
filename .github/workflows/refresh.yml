name: Refresh internship data
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_data.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh Summer 2027 listings" && git push
